# How the app's own copy is generated.
#
# The ARB files are the source of truth and the generated .dart files are
# committed, because on this Flutter (3.47) there is no synthetic package:
# `--synthetic-package` is deprecated and cannot be enabled, so anything that
# imports the localizations has to name a real file in the tree.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# Fail loudly instead of silently rendering English.
#
# The default is `true`, which makes `AppLocalizations.of(context)` return null
# when the delegate is missing — a screen then falls back to hard-coded English
# with no warning, which is exactly the bug the fallback rules exist to prevent.
# Non-nullable means a widget with no delegate behind it throws at the call site
# (in a test, loudly; in the app, before release), so the fix is always "install
# the delegate", never "add a `!`".
nullable-getter: false
