name: nexus
description: "Nexus — your devices, one system. A local-first mesh where your devices find, pair, and talk to each other directly — no cloud, no account."
publish_to: 'none'

version: 0.4.0+157

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.0
  file_selector: ^1.1.0
  shared_preferences: ^2.3.0
  tray_manager: ^0.5.0
  window_manager: ^0.5.0
  url_launcher: ^6.2.0
  web_socket_channel: ^3.0.0
  llamadart: ^0.11.1
  open_wake_word: ^0.3.0
  google_fonts: ^6.3.3
  # The PC's Ollama, over HTTP on the local network — see
  # lib/core/ollama_service.dart. Already in the tree as a transitive
  # dependency (mobile_scanner pulls it in); declared here because the shell now
  # talks to it directly.
  http: ^1.6.0
  device_info_plus: ^13.3.0
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Two launcher marks, because Android can only show one icon per activity
# alias and the app switches between those aliases at runtime (see
# lib/core/services/icon_service.dart). This block is the app's *default*
# icon, generated by a bare `dart run flutter_launcher_icons`; the dark set is
# the second block in dark_icons.yaml, generated with
# `dart run flutter_launcher_icons -f dark_icons.yaml`.
#
# The sources are build-time inputs only — they are deliberately not listed
# under `flutter: assets:`, so nothing ships in the APK. They are the flat
# renderings of the mesh mark: the token-coloured background with the mark
# on top, at the footprint the previous mark used (52.08% of the canvas).
#
# Regenerating rewrites every `android:icon` line in AndroidManifest.xml to
# whichever set ran last, so the two alias icons (and the application's own)
# have to be checked afterwards — see the note in dark_icons.yaml and
# test/launcher_icons_test.dart, which fails if they are wrong.
flutter_launcher_icons:
  android: "ic_launcher_light"
  ios: false
  image_path: "assets/icon/icon_light.png"

flutter:
  uses-material-design: true

  assets:
    - assets/tray_icon.png
    - assets/wake/melspectrogram.onnx
    - assets/wake/embedding_model.onnx
    - assets/wake/hey_jarvis_v0.1.onnx

# What the llamadart build hook fetches for the native inference runtime: the
# llama.cpp runtime alone. The package can also carry LiteRT-LM (for
# `.litertlm` models), which Nexus never loads — leaving it out keeps the APK
# smaller and the build honest about what it ships.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
