name: nexus
description: "Nexus — your devices, one system. A local-first mesh where your devices find, pair, and talk to each other directly — no cloud, no account."
publish_to: 'none'

version: 0.1.22+122

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.0
  file_selector: ^1.1.0
  tray_manager: ^0.5.0
  window_manager: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/tray_icon.png
