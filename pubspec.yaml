name: nexus
description: "Nexus — your devices, one system. A local-first mesh where your devices find, pair, and talk to each other directly — no cloud, no account."
publish_to: 'none'

version: 1.0.1+160

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.0
  file_selector: ^1.1.0
  shared_preferences: ^2.3.0
  tray_manager: ^0.5.0
  window_manager: ^0.5.0
  url_launcher: ^6.2.0
  web_socket_channel: ^3.0.0
  llamadart: ^0.11.1
  open_wake_word: ^0.3.0
  google_fonts: ^6.3.3
  # The PC's Ollama, over HTTP on the local network — see
  # lib/core/ollama_service.dart. Already in the tree as a transitive
  # dependency (mobile_scanner pulls it in); declared here because the shell now
  # talks to it directly.
  http: ^1.6.0
  device_info_plus: ^13.3.0
  flutter_colorpicker: ^1.1.0
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  google_mlkit_image_labeling: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1
  package_info_plus: ^10.2.2
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  dartssh2: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Two launcher marks, because Android can only show one icon per activity
# alias and the app switches between those aliases at runtime (see
# lib/core/services/icon_service.dart). This block is the app's *default*
# icon, generated by a bare `dart run flutter_launcher_icons`; the dark set is
# the second block in dark_icons.yaml, generated with
# `dart run flutter_launcher_icons -f dark_icons.yaml`.
#
# The source is the user's own artwork, assets/logo.png, used for both the
# square icons and the adaptive foreground. It is a build-time input only —
# the splash needs it at runtime, so it is also listed under `flutter:
# assets:` below.
#
# Regenerating rewrites every `android:icon` line in AndroidManifest.xml to
# whichever set ran last, so the two alias icons (and the application's own)
# have to be checked afterwards — see the note in dark_icons.yaml and
# test/launcher_icons_test.dart, which fails if they are wrong.
flutter_launcher_icons:
  android: "ic_launcher_light"
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FAFAF8"
  adaptive_icon_foreground: "assets/logo.png"

# The native splash: the user's mark on the same field the artwork itself is
# drawn on, in both system themes. The field colour is sampled from the
# artwork's own corners — pure white for the light mark, #131315 for the dark
# one — so the flat window and the image have no seam, and a square image is
# never laid on a contrasting colour (which read as a white photo on purple).
#
# The image is the tile inside a field-coloured canvas, 768 px wide — 192 dp at
# the 4x `flutter_native_splash` assumes for its generated bitmaps. That number
# is not arbitrary: Android 12 draws this image at 192 dp and masks it to a
# 192 dp circle, so the tile has to sit inside the circle's 136 dp inscribed
# square or its corners get sliced off (they did, on the first attempt: the
# platform showed a circle-clipped tile for half a second, then Flutter drew
# the whole square). The tile is 126 dp of the canvas, comfortably inside, and
# the canvas edge is the field colour, so the mask has nothing to cut.
#
# Regenerate with `dart run flutter_native_splash:create`. That rewrites
# android/.../drawable/launch_background.xml, values/styles.xml and
# values-v31/styles.xml, so check afterwards that the window still paints
# @color/nexus_bg once Flutter owns it — see LaunchTheme's NormalTheme.
#
# No iOS block: this repository has no ios/ project to write into.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_mark.png
  color_dark: "#131315"
  image_dark: assets/splash_mark_dark.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/splash_mark.png
    icon_background_color: "#FFFFFF"
    color_dark: "#131315"
    image_dark: assets/splash_mark_dark.png
    icon_background_color_dark: "#131315"

flutter:
  uses-material-design: true

  assets:
    # The splash's own marks (one per system theme), also drawn under the first
    # Flutter frame by SplashFade so the hand-off from the native splash is
    # invisible.
    - assets/splash_mark.png
    - assets/splash_mark_dark.png
    - assets/tray_icon.png
    - assets/wake/melspectrogram.onnx
    - assets/wake/embedding_model.onnx
    - assets/wake/hey_jarvis_v0.1.onnx

# What the llamadart build hook fetches for the native inference runtime: the
# llama.cpp runtime alone. The package can also carry LiteRT-LM (for
# `.litertlm` models), which Nexus never loads — leaving it out keeps the APK
# smaller and the build honest about what it ships.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
