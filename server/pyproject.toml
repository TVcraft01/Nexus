[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-server"
version = "0.3.0"
description = "Nexus Server - Universal, Local AI Orchestrator"
requires-python = ">=3.10"
dependencies = [
    "zeroconf>=0.60.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=6.0.0",
    "pystray>=0.19.0",
]
voice = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
]
vision = [
    "opencv-python>=4.8.0",
    "pyzbar>=0.1.9",
]
full = [
    "nexus-server[gui,voice,vision]",
    "qrcode[pil]>=7.0.0",
    "numpy>=1.24.0",
    "gigatoken>=0.10.0",
]

[project.scripts]
nexus = "nexus_server.main:main"
nexus-headless = "nexus_server.main:main"

[tool.setuptools.packages.find]
include = ["nexus_server*"]

[tool.ruff]
target-version = "py310"
line-length = 100
