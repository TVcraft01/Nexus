org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 compiles Kotlin natively, and it must be enabled here: with
# built-in Kotlin off, AGP 9 does not run the Kotlin compile tasks of plugin
# subprojects that apply the Kotlin Gradle plugin themselves (mobile_scanner
# is one), and the app then cannot find their plugin classes.
android.builtInKotlin=true
