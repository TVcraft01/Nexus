[package]
name = "nexus-core"
version = "0.3.0"
edition = "2021"
description = "Nexus core: high-performance Rust engine for the privacy-first AI orchestrator"

[lib]
name = "nexus_core"
crate-type = ["lib", "cdylib"]

[dependencies]
# Cryptography
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hkdf = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Networking
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# MQTT for universal device communication
rumqttc = { version = "0.24", optional = true }
# WebSocket for external access
tokio-tungstenite = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }

# mDNS / Service discovery
mdns-sd = { version = "0.10", optional = true }

# FFI / Python bindings
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
thiserror = "1"
anyhow = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Base64
base64 = "0.21"

# ECDH for key exchange
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Compression for message streaming
flate2 = { version = "1", optional = true }

[features]
default = []
mdns = ["mdns-sd"]
mqtt = ["rumqttc", "futures-util"]
websocket = ["tokio-tungstenite", "futures-util"]
python-bindings = ["pyo3"]
full = ["mdns", "mqtt", "websocket", "flate2"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.maturin]
name = "nexus_core._nexus_core"
bindings = "pyo3"
python-source = "."
module-name = "nexus_core._nexus_core"
