[package]
name = "nexus-core"
version = "0.3.0"
edition = "2021"
description = "Nexus core: high-performance Rust engine for the privacy-first AI orchestrator"

[lib]
name = "nexus_core"
crate-type = ["lib", "cdylib"]

[dependencies]
# Cryptography
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hkdf = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Networking
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# MQTT for universal device communication
rumqttc = "0.24"
# WebSocket for external access
tokio-tungstenite = "0.21"
futures-util = "0.3"

# mDNS / Service discovery
mdns-sd = "0.10"

# FFI / Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
thiserror = "1"
anyhow = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Base64
base64 = "0.21"

# ECDH for key exchange
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Compression for message streaming
flate2 = "1"

[features]
default = []
mdns = ["mdns-sd"]
python-bindings = ["pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
