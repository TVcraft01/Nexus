name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  linux:
    name: Linux bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev
      - name: Build
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/nexus-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux
          path: nexus-linux-x64.tar.gz

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter pub get
          flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk nexus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android
          path: nexus.apk

  windows:
    name: Windows bundle
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter pub get
          flutter create --platforms=windows .
          flutter build windows --release
      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nexus-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: nexus-windows-x64.zip

  release:
    name: Publish release
    needs: [linux, android, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-linux
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-android
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-windows
      - name: Read version and notes
        id: ver
        shell: bash
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # The release body is the changelog section for this version, verbatim.
          # If the section is missing the release still publishes, with a
          # one-line body, rather than failing the whole build over prose.
          awk -v ver="## [$V]" '
            index($0, ver) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Nexus v$V — platform bundles for Linux, Windows, and Android." > release-notes.md
          fi
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.ver.outputs.version }}"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" \
              nexus-linux-x64.tar.gz \
              nexus.apk \
              nexus-windows-x64.zip \
              --clobber
            gh release edit "$V" --title "Nexus $V" --notes-file release-notes.md
          else
            gh release create "$V" \
              nexus-linux-x64.tar.gz \
              nexus.apk \
              nexus-windows-x64.zip \
              --title "Nexus $V" \
              --notes-file release-notes.md
          fi
