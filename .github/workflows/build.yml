name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/nexus-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux
          path: nexus-linux-x64.tar.gz

      - name: Version
        id: ver
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release (for auto-update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.ver.outputs.version }}"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" nexus-linux-x64.tar.gz --clobber
            echo "Updated release $V"
          else
            gh release create "$V" nexus-linux-x64.tar.gz \
              --title "Nexus $V" \
              --notes "Linux bundle for Nexus $V — the app will offer this as an in-app update."
            echo "Created release $V"
          fi

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build
        run: |
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
