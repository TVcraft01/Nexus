name: Android Tests

on:
  push:
    branches: ["**"]
    paths:
      - "client/android/**"
      - ".github/workflows/android-tests.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "client/android/**"
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Generate Gradle wrapper
        working-directory: client/android
        run: gradle wrapper --gradle-version 8.11

      - name: Run unit tests
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: client/android
          arguments: test --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            client/android/**/build/reports/tests/**/*
            client/android/**/build/test-results/**/*
          retention-days: 7
